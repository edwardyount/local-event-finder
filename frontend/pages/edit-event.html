<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event | Local Event Finder</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="navbar">
        <a href="../index.html" class="logo">Local<span>ly.</span></a>
        <nav>
            <a href="../index.html">Explore</a>
            <a href="favorites.html">Favorites</a>
            <a href="rsvps.html">My RSVPs</a>
            <a href="create-event.html">Create Event</a>
            <a href="login.html" class="login-btn">Log In</a>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-card form-card">
            <p class="eyebrow">YOUR LISTING</p>
            <h1>Edit your event listing</h1>
            <p class="auth-description">Update the details people see. Only you can edit this event.</p>

            <p id="formStatus" class="form-message" role="status"></p>

            <form id="eventForm" data-mode="edit" novalidate>

                <label for="title">Event title</label>
                <input type="text" id="title" maxlength="200" placeholder="Enter an event title" required>
                <p class="field-error" id="error-title" role="alert"></p>

                <label for="categoryId">Category</label>
                <select id="categoryId" required>
                    <option value="">Select a category</option>
                </select>
                <p class="field-error" id="error-categoryId" role="alert"></p>

                <label for="description">Description</label>
                <textarea id="description" rows="4" maxlength="5000" placeholder="Tell people what to expect at your event" required></textarea>
                <p class="field-error" id="error-description" role="alert"></p>

                <label for="date">Date</label>
                <input type="date" id="date" required>
                <p class="field-error" id="error-date" role="alert"></p>

                <div class="form-row">
                    <div>
                        <label for="startTime">Start time (ET)</label>
                        <input type="time" id="startTime" required>
                        <p class="field-error" id="error-startTime" role="alert"></p>
                    </div>
                    <div>
                        <label for="endTime">End time (ET)</label>
                        <input type="time" id="endTime" required>
                        <p class="field-error" id="error-endTime" role="alert"></p>
                    </div>
                </div>

                <label for="location">Location</label>
                <input type="text" id="location" maxlength="300" placeholder="Enter venue or street address" required>
                <p class="field-error" id="error-location" role="alert"></p>

                <label for="capacity">Capacity</label>
                <input type="number" id="capacity" min="1" step="1" placeholder="Maximum number of attendees" required>
                <p class="form-hint" id="capacityHint" hidden></p>
                <p class="field-error" id="error-capacity" role="alert"></p>

                <button type="submit" class="auth-submit" id="submitButton">Save Changes</button>
                <p id="formMessage" class="form-message" role="status"></p>
            </form>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/event-form.js"></script>
</body>
</html>
