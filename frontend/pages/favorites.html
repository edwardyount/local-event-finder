<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites | Local Event Finder</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="navbar">
        <a href="../index.html" class="logo">Local<span>ly.</span></a>
        <nav>
            <a href="../index.html">Explore</a>
            <a href="favorites.html">Favorites</a>
            <a href="rsvps.html">My RSVPs</a>
            <a href="create-event.html">Create Event</a>
            <a href="login.html" class="login-btn">Log In</a>
        </nav>
    </header>

    <main>
        <section class="events-section favorites-section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">YOUR LIST</p>
                    <h2>My saved events</h2>
                </div>
                <span id="favoritesCount"></span>
            </div>

            <p id="favoritesMessage" class="form-message" role="status"></p>

            <div id="favoritesGrid" class="event-grid"></div>

            <p id="favoritesEmpty" class="empty-message" hidden>
                No saved events yet. Tap the heart on an event to save it.
            </p>

            <p id="favoritesError" class="empty-message" role="alert" hidden>
                Could not load your favorites.
                <button type="button" id="favoritesRetry">Retry</button>
            </p>
        </section>
    </main>

    <footer>
        <p>Local Event Finder | Discover more. Experience more.</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/format.js"></script>
    <script src="../js/favorites.js"></script>
    <script src="../js/favorites-page.js"></script>
</body>
</html>
